#2 services: Backend relies on itself to run in isolation, while frontend relies on backend, all build in 1 docker-network
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      #env variables
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - ENV_JWT_KEY=${ENV_JWT_KEY}
      - WALMART_KEY=${WALMART_KEY}
    networks:
      - app-network
      
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8080}
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-network
#undefined pg 
volumes:
  postgres_data:
#new app network for both services
networks:
  app-network:
    driver: bridge
