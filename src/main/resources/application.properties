spring.application.name=demo

# ── Server ──────────────────────────────────────────────────────────────────
# Render injects PORT automatically. Fall back to 8080 locally.
server.port=${PORT:8080}

# ── Database (Neon PostgreSQL) ───────────────────────────────────────────────
# Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# as environment variables in Render (or your local .env / IDE run config).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── Security ─────────────────────────────────────────────────────────────────
# Set JWT_KEY as an environment variable in Render.
JWT_KEY=${JWT_KEY}

# ── Third-party APIs ─────────────────────────────────────────────────────────
walmart.id=${WALMART_ID}
nutritionix.app-id=${NUTRITIONIX_APP_ID:}
nutritionix.app-key=${NUTRITIONIX_APP_KEY:}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Set FRONTEND_URL to the Render static-site URL, e.g.
#   https://plated-frontend.onrender.com
# Falls back to localhost for local development.
frontend.url=${FRONTEND_URL:http://localhost:3000}

# ── Environment flag ─────────────────────────────────────────────────────────
prod=${PROD:true}
